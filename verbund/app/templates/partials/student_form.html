{# School-held fields only. Interests and free times come from the student's own questionnaire. #}
<form method="post" action="{{ action }}" class="form-grid">
  <div class="field"><label for="first_name">First name</label><input id="first_name" name="first_name" type="text" required autocomplete="off" value="{{ s.first_name if s else '' }}"></div>
  <div class="field"><label for="last_name">Last name</label><input id="last_name" name="last_name" type="text" required autocomplete="off" value="{{ s.last_name if s else '' }}"></div>
  <div class="field"><label for="grade">Grade</label>
    <select id="grade" name="grade" required>
      <option value="">Choose</option>
      {% for g in grades %}<option value="{{ g }}"{% if s and s.grade == g %} selected{% endif %}>Grade {{ g }}</option>{% endfor %}
    </select>
  </div>
  <div class="field"><label for="homeroom">Homeroom</label><input id="homeroom" name="homeroom" type="text" placeholder="e.g. 8B" value="{{ s.homeroom if s else '' }}"></div>
  <div class="field"><label for="role">Role</label>
    <select id="role" name="role" required>
      <option value="new"{% if s and s.role == 'new' %} selected{% endif %}>New student</option>
      <option value="buddy"{% if s and s.role == 'buddy' %} selected{% endif %}>Buddy</option>
    </select>
  </div>
  <div class="field"><label for="capacity">Buddy places</label>
    <select id="capacity" name="capacity">
      {% for n in [1, 2, 3] %}<option value="{{ n }}"{% if s and s.capacity == n %} selected{% endif %}>{{ n }}</option>{% endfor %}
    </select>
    <span class="help">Buddies only: how many new students they can look after.</span>
  </div>
  <div class="field full"><label for="languages">Languages</label>
    <input id="languages" name="languages" type="text" placeholder="Korean (home); English (fluent)" value="{{ s.language_text if s else '' }}">
    <span class="help">Separate with semicolons. Levels: home, fluent or learning.</span>
  </div>
  <div class="field full"><label for="clubs">Clubs and activities</label>
    <input id="clubs" name="clubs" type="text" placeholder="Robotics Club; Choir" value="{{ s.clubs|join('; ') if s else '' }}">
  </div>
  <div class="full actions">
    <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
  </div>
</form>
